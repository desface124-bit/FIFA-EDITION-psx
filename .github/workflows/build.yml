name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev
          pip install --upgrade pip setuptools buildozer cython

      - name: Build with Buildozer
        run: |
          # Executa o buildozer para inicializar as pastas do Android SDK
          buildozer android debug || true
          
          # Aceita as licenças diretamente dentro do diretório do Buildozer
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          if [ -d "$SDK_DIR/cmdline-tools/latest/bin" ]; then
            yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --licenses || true
          elif [ -d "$SDK_DIR/tools/bin" ]; then
            yes | $SDK_DIR/tools/bin/sdkmanager --licenses || true
          fi
          
          # Aceita licenças no SDK padrão por garantia
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # Compila o APK pra valer
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
          
