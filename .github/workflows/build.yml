name: Gerar APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Compilar APK
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: CE-FIFA-APK
          path: ${{ steps.buildozer.outputs.filename }}
